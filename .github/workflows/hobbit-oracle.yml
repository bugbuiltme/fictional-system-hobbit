
name: HOBBIT Oracle Ultra-Verbose Build and Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/hobbit-oracle.yml"

permissions:
  contents: read

concurrency:
  group: hobbit-oracle
  cancel-in-progress: false

jobs:
  hobbit:
    name: HOBBIT Oracle Installation and Evaluation
    runs-on: [self-hosted, Linux, X64]

    # LLVM compilation can take many hours on 1 GiB RAM.
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      HOBBIT_WORKDIR: /home/ubuntu/hobbit-work
      HOBBIT_BRANCH: hashes/blake3
      HOBBIT_JOBS: "1"
      HOBBIT_SWAP_GB: "8"
      HOBBIT_SCRIPT: scripts/hobbit_1gb_ultraverbose.sh
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 00 - Checkout repository
        uses: actions/checkout@v4

      - name: 01 - Verify Oracle runner identity
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "HOBBIT ORACLE RUNNER VERIFICATION"
          echo "========================================"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow run: $GITHUB_RUN_ID"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Date: $(date -Is)"
          uname -a

          if [[ "$RUNNER_NAME" != "hobbit" ]]; then
            echo "::error::Expected runner hobbit"
            exit 1
          fi

          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo "::error::Expected x86_64 architecture"
            exit 1
          fi

      - name: 02 - Prepare diagnostic directory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hobbit-ci"
          echo "CI_LOG_DIR=$RUNNER_TEMP/hobbit-ci" \
            >> "$GITHUB_ENV"

      - name: 03 - Ultra-verbose hardware diagnostics
        run: |
          set -o pipefail
          {
            echo "========== SYSTEM =========="
            hostnamectl || true
            uname -a
            cat /etc/os-release

            echo "========== CPU =========="
            lscpu
            nproc

            echo "========== MEMORY =========="
            free -h
            cat /proc/meminfo
            cat /proc/swaps

            echo "========== STORAGE =========="
            df -h
            df -i
            lsblk

            echo "========== LIMITS =========="
            ulimit -a

            echo "========== MEMORY PRESSURE =========="
            cat /proc/pressure/memory || true

            echo "========== OOM HISTORY =========="
            sudo -n dmesg -T 2>/dev/null \
              | grep -Ei 'out of memory|oom|killed process' \
              | tail -60 || true

            echo "========== COMPILERS =========="
            gcc --version | head -1 || true
            g++ --version | head -1 || true
            cmake --version | head -1 || true
            ninja --version || true
            python3 --version || true

            echo "========== NETWORK =========="
            ip -brief address || true
            ip route || true
          } 2>&1 | tee "$CI_LOG_DIR/system.log"

      - name: 04 - Verify installation script
        run: |
          set -Eeuo pipefail

          test -f "$HOBBIT_SCRIPT"
          bash -n "$HOBBIT_SCRIPT"

          echo "Script SHA256:"
          sha256sum "$HOBBIT_SCRIPT"

          echo "Script size:"
          wc -lc "$HOBBIT_SCRIPT"

          echo "Script syntax: PASS"

      - name: 05 - Run HOBBIT installation and tests
        id: install
        continue-on-error: true
        run: |
          set -uo pipefail

          echo "========================================"
          echo "HOBBIT FULL INSTALLATION START"
          echo "========================================"
          echo "Workdir: $HOBBIT_WORKDIR"
          echo "Parallel jobs: $HOBBIT_JOBS"
          echo "Swap target: ${HOBBIT_SWAP_GB} GiB"
          echo "Start: $(date -Is)"

          START=$(date +%s)

          # Bash xtrace provides additional command diagnostics.
          # Do not enable this for scripts containing secrets.
          export PS4='+ ${BASH_SOURCE}:${LINENO}: '

          bash -x "$HOBBIT_SCRIPT" \
            2>&1 | tee "$CI_LOG_DIR/install.log"

          RC=${PIPESTATUS[0]}
          END=$(date +%s)

          echo "$RC" > "$CI_LOG_DIR/install.exit"
          echo "$((END - START))" \
            > "$CI_LOG_DIR/install.seconds"

          echo "========================================"
          echo "INSTALLATION EXIT CODE: $RC"
          echo "DURATION SECONDS: $((END - START))"
          echo "========================================"

          exit "$RC"

      - name: 06 - Verify compiler and runtime
        if: always()
        run: |
          {
            echo "========== BUILD ARTIFACTS =========="

            CLANG="$HOBBIT_WORKDIR/build/bin/clang++"

            if [[ -x "$CLANG" ]]; then
              echo "Compiler executable: PRESENT"
              "$CLANG" --version
              "$CLANG" -print-resource-dir
              sha256sum "$CLANG"
              file "$CLANG"
              ldd "$CLANG" || true
            else
              echo "Compiler executable: MISSING"
            fi

            echo "========== RUNTIME =========="

            RT="$HOBBIT_WORKDIR/runtime"
            if [[ -d "$RT" ]]; then
              find "$RT" -maxdepth 2 -type f \
                -printf '%p %s bytes\n'
            else
              echo "Runtime directory: MISSING"
            fi

            echo "========== REPORT FILES =========="

            for f in \
              "$HOBBIT_WORKDIR/REPORT.txt" \
              "$HOBBIT_WORKDIR/results.json" \
              "$HOBBIT_WORKDIR/results.csv"; do
              if [[ -f "$f" ]]; then
                ls -lh "$f"
              else
                echo "MISSING: $f"
              fi
            done

          } 2>&1 | tee "$CI_LOG_DIR/verification.log"

      - name: 07 - Analyze tests and log failures
        if: always()
        run: |
          python3 - "$HOBBIT_WORKDIR" "$CI_LOG_DIR" <<'PY'
          import collections
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          ci = pathlib.Path(sys.argv[2])
          rows_path = root / "results.json"
          install_log = ci / "install.log"

          lines = []
          def emit(s=""):
              print(s, flush=True)
              lines.append(s)

          emit("=" * 90)
          emit("HOBBIT ULTRA-VERBOSE TEST ANALYSIS")
          emit("=" * 90)

          if rows_path.exists():
              rows = json.loads(rows_path.read_text())
              emit(f"Recorded test events: {len(rows)}")

              for variant in (
                  "gcc", "hobbit_O0",
                  "hobbit_O1", "hobbit_O2"
              ):
                  emit("")
                  emit(f"CONFIGURATION: {variant}")
                  emit("-" * 70)

                  subset = [
                      r for r in rows
                      if r.get("variant") == variant
                  ]

                  for r in subset:
                      emit(
                          f"{r.get('phase','?'):8} "
                          f"{r.get('case','?'):25} "
                          f"exit={str(r.get('exit_code','?')):5} "
                          f"time={str(r.get('seconds','?')):8} "
                          f"{r.get('detail','')}"
                      )

                  counts = collections.Counter(
                      r.get("detail")
                      for r in subset
                      if r.get("phase") == "run"
                  )
                  emit(f"Outcome counts: {dict(counts)}")

              emit("")
              emit("COMPILATION FAILURES:")
              failures = [
                  r for r in rows
                  if r.get("phase") == "compile"
                  and r.get("exit_code") != 0
              ]
              if failures:
                  for r in failures:
                      emit(
                          f"{r.get('variant')} "
                          f"{r.get('case')}: "
                          f"{r.get('output','')[-1000:]}"
                      )
              else:
                  emit("None recorded")

          else:
              emit("NO RESULTS.JSON FOUND")
              emit("Installation/build may have failed before tests.")

          if install_log.exists():
              text = install_log.read_text(errors="replace")
              patterns = {
                  "errors": r"\berror:",
                  "warnings": r"\bwarning:",
                  "fatal": r"\bfatal\b",
                  "oom": r"out of memory|oom.kill|killed process",
                  "segfault": r"segmentation fault|segfault",
                  "timeouts": r"\btimeout\b",
                  "failed": r"\bfailed\b",
              }

              emit("")
              emit("INSTALLATION LOG COUNTS:")
              for name, pattern in patterns.items():
                  count = len(re.findall(
                      pattern, text, re.IGNORECASE
                  ))
                  emit(f"{name:16}: {count}")

              emit("")
              emit("LAST 60 IMPORTANT LOG LINES:")
              important = [
                  line for line in text.splitlines()
                  if re.search(
                      r"error:|fatal|failed|oom|"
                      r"killed process|segfault|"
                      r"\[FAIL\]|timeout",
                      line, re.IGNORECASE
                  )
              ]
              for line in important[-60:]:
                  emit(line[:500])

          (ci / "analysis-summary.txt").write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: 08 - FINAL CONSOLE SUMMARY
        if: always()
        run: |
          echo ""
          echo "################################################"
          echo "# HOBBIT ORACLE - FINAL CONSOLE SUMMARY"
          echo "################################################"

          echo "Runner: $RUNNER_NAME"
          echo "Run: $GITHUB_RUN_ID"
          echo "Timestamp: $(date -Is)"

          if [[ -f "$CI_LOG_DIR/install.exit" ]]; then
            RC=$(cat "$CI_LOG_DIR/install.exit")
            echo "Installer exit code: $RC"
          else
            echo "Installer exit code: NOT RECORDED"
          fi

          if [[ -f "$CI_LOG_DIR/install.seconds" ]]; then
            SECONDS_USED=$(cat "$CI_LOG_DIR/install.seconds")
            echo "Installation duration: ${SECONDS_USED}s"
          fi

          echo ""
          echo "========== HOBBIT REPORT =========="
          if [[ -f "$HOBBIT_WORKDIR/REPORT.txt" ]]; then
            cat "$HOBBIT_WORKDIR/REPORT.txt"
          else
            echo "Report unavailable"
          fi

          echo ""
          echo "========== TEST ANALYSIS =========="
          if [[ -f "$CI_LOG_DIR/analysis-summary.txt" ]]; then
            cat "$CI_LOG_DIR/analysis-summary.txt"
          fi

          echo ""
          echo "========== LAST 100 INSTALL LOG LINES =========="
          if [[ -f "$CI_LOG_DIR/install.log" ]]; then
            tail -100 "$CI_LOG_DIR/install.log"
          fi

          echo ""
          echo "========== FINAL MEMORY =========="
          free -h
          swapon --show || true
          df -h "$HOBBIT_WORKDIR" || true

          echo ""
          echo "################################################"
          echo "# END HOBBIT CONSOLE SUMMARY"
          echo "################################################"

      - name: 09 - Publish GitHub job summary
        if: always()
        run: |
          {
            echo "# HOBBIT Oracle Evaluation"
            echo ""
            echo "**Runner:** $RUNNER_NAME"
            echo ""
            echo "**Installation step:** ${{ steps.install.outcome }}"
            echo ""
            echo "## Evaluation report"
            echo '```text'
            if [[ -f "$HOBBIT_WORKDIR/REPORT.txt" ]]; then
              cat "$HOBBIT_WORKDIR/REPORT.txt"
            else
              echo "Report unavailable"
            fi
            echo '```'
            echo ""
            echo "Full logs are available in workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 10 - Collect logs
        if: always()
        run: |
          mkdir -p "$CI_LOG_DIR/collected"

          if [[ -d "$HOBBIT_WORKDIR/logs" ]]; then
            cp -a "$HOBBIT_WORKDIR/logs" \
              "$CI_LOG_DIR/collected/" || true
          fi

          for name in REPORT.txt results.json results.csv; do
            if [[ -f "$HOBBIT_WORKDIR/$name" ]]; then
              cp "$HOBBIT_WORKDIR/$name" \
                "$CI_LOG_DIR/collected/" || true
            fi
          done

      - name: 11 - Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hobbit-oracle-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/hobbit-ci/
          if-no-files-found: warn
          retention-days: 30

      - name: 12 - Enforce installation and test results
        if: always()
        run: |
          python3 - "$HOBBIT_WORKDIR" "$CI_LOG_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          ci = pathlib.Path(sys.argv[2])
          errors = []

          exit_file = ci / "install.exit"
          if not exit_file.exists():
              errors.append("Installer never recorded completion")
          elif exit_file.read_text().strip() != "0":
              errors.append("Installer returned nonzero exit code")

          clang = root / "build/bin/clang++"
          if not clang.is_file():
              errors.append("HOBBIT clang++ missing")

          report = root / "results.json"
          if not report.exists():
              errors.append("Evaluation results missing")
          else:
              rows = json.loads(report.read_text())
              valid = {
                  "basic", "derived", "derived2",
                  "multiple", "virtualbase", "heap",
                  "array", "placement", "copy",
                  "move", "vector"
              }

              for variant in (
                  "gcc", "hobbit_O0",
                  "hobbit_O1", "hobbit_O2"
              ):
                  compiled = any(
                      r.get("variant") == variant
                      and r.get("case") == "suite"
                      and r.get("phase") == "compile"
                      and r.get("exit_code") == 0
                      for r in rows
                  )
                  if not compiled:
                      errors.append(f"{variant}: compile failed")

                  passes = {
                      r.get("case")
                      for r in rows
                      if r.get("variant") == variant
                      and r.get("phase") == "run"
                      and r.get("detail") == "PASS"
                  }
                  missing = valid - passes
                  if missing:
                      errors.append(
                          f"{variant}: functional failures "
                          + ", ".join(sorted(missing))
                      )

              hash_ok = any(
                  r.get("case") == "hash"
                  and r.get("phase") == "run"
                  and r.get("detail") == "PASS"
                  for r in rows
              )
              if not hash_ok:
                  errors.append("Hash runtime test failed")

          print("=" * 70)
          print("FINAL CI VERDICT")
          print("=" * 70)

          if errors:
              print("STATUS: FAILED")
              for error in errors:
                  print("FAIL:", error)
                  print("::error::" + error)
              sys.exit(1)

          print("STATUS: PASS")
          print("Installation and required functional tests passed.")
          print("Corruption probe results require separate review.")
          PY
